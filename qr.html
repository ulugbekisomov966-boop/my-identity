<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой QR-код</title>
</head>
<body>

<h2>Мой идентификатор</h2>

<div id="qr"></div>

<p>Этот QR используется для подтверждения личности.</p>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

<script>
  const identityKey = "9b7d4e31-6c82-4f15-a9b6-27d3e8c54170";

  new QRCode(document.getElementById("qr"), {
    text: identityKey,
    width: 220,
    height: 220
  });
</script>

</body>
</html>
